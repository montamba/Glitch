<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
    <title>Document</title>
    <style>
        main{
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            color: aqua;

        }

        .videocontainer{
            width: 65%;
            background: black;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            border-right: 5px solid aqua;
        }

        .videocontainer > .seperate{
            height: 60%;
            display:flex;
            align-items: center;
            justify-content: center;
            width: 100%;

        }

        .seperate > .vid {
            width: 600px;
            height: 400px;
            border: 5px solid aqua;
            background: rgba(0, 0, 0, 0.5);
            overflow:hidden;

        }

        .vid > video{
            width: 100%;
            height: inherit;
        }

        .genrate{
            flex: 1;
            width: 100%;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
        }

        .vtitle{
            padding-top: 30px;
            display: flex;
            width: 100%;
            justify-content: space-between;
        }

        .vtitle > button{
            width: 100px;
            border: 5px solid aqua;
            color: aqua;
            background: black;
            transition: 300ms;
            border-radius: 50px;
        }

        .vtitle > button:hover{
            box-shadow: 0 0 20px aqua;
        }

        .genre{
            width: 100%;
            height: 70px;
            display: flex;
            align-items: center;
        }

        .dess{
            width: 100%;
            flex: 1;
            border: 5px solid aqua;
            border-radius: 10px;
            padding: 5px;
        }

        .othervid{
            display:flex;
            flex-direction: column;
            overflow: auto;
            padding: 10px 30px;
            background: black;
            flex:1;
            gap:10px;9
        }

        .con{
            width:100%;
            height: 150px;
            border: 3px solid aqua;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content:space-between;
            overflow:hidden;
            gap:10px;

        }

        .con > .iim{
            width: 120px;
            height: 130px;
            overflow:hidden;
            
        }

        .iim > img{
            width: 100%;
        }
        .s{
            flex:1;
            padding-left: 30px;
        }
    </style>  
</head>
<body>
    <main>
        <div class="videocontainer">
            <div class="seperate">
                <div class="vid">
                    <video controls>
                        <source src="{{mv[2]}}" type="video/mp4">
                       
                    </video>
                </div>
                <button class="x" onclick="goback()" style="top:50px;left: 40px;">x</button>
            </div>
            <div class="genrate">
                <div class="vtitle">
                    <h1>{{mv[3]}}</h1>
                    <button>Save</button>
                </div>
                <div class="genre">
                    <h2>{{mv[5]}}</h2>
                </div>

                <div class="dess">
                    <p>{{mv[4]}}</p>
                </div>

            </div>
        </div>
        <div class="othervid">
            

            {% for img in dd %}
            <div class="con" onclick="getid({{img[0]}})">
                <div class="iim">
                    <img src="../{{ img[1] }}">
                </div>
                <div class="s">
                    <h1>{{img[3]}}</h1>
                </div>
            </div>
            {% endfor %}
        </div>

        <form id="fm" action="/watch" style="display:none;" method="post">
            <input id="h" name="mid">
        </form>



    </main>

    <script>
        function goback(){
            window.history.back();
        }

        function getid(idd){
                let a = event.currentTarget;
                

                
                let form = document.getElementById("fm")
                let t = document.getElementById("h")

                alert(idd)

                t.value = idd
                form.submit()

        }

        

        
    </script>
    </body>
</html>
