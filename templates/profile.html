<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='style.css')}}">
    <style>

        main{
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profilecon{
            width: 60%;
            border: 10px solid aqua;
            height: 500px;
            border-radius: 10px;
            overflow: hidden;
        }

        .profilecon > form{
            width: 100%;
            height: inherit;
            display: flex;
            flex-direction: column;
            background: black;
            color: aqua;
        }

        .profilecon > form > .profileinfo{
            
            flex: 1;
            display: flex;
            align-items: center;
            flex-direction: column;

        }

        .profileinfo > div{
            width: 100%;
            height: 40%;
            display: flex;
            align-items: center;
            font-size: 30px;
            padding: 30px;
            gap: 20px;
        }

        .profileinfo > div >input{
            flex: 1;
            background: none;
            border: none;
            border-bottom: 3px solid aqua;
            height: 30px;
            color: aqua;
            font-size: larger;

        }

        .profileinfo > input[type="submit"]{
            width: 100px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            border: 2px solid lightblue;
            background: lightblue;
            transition: 300ms;
        }

        .profileinfo > input[type="submit"]:hover{
            color: aqua;
            border: 2px solid aqua;
            background-color: black;
            box-shadow: 0 0 20px aqua;
        }

        .profilepic{
            width: 100%;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profilepic > .imagecon{
            position: relative;
            width: 100px;
            height: 100px;
            border: 2px solid aqua;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            
        }

        .imagecon > label{
            position: absolute;
            right: 0;
            bottom: 0;
            width: 30px;
            height: 30px;
            background: black;
            border-radius: 50%;
            color: aqua;
            border: 5px solid aqua;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 300ms;


        }

        .imagecon > label:hover{
            border: 2px solid aqua;
            box-shadow: 0 0 15px aqua;
            transform: rotate(360deg);
            cursor: pointer;
        }

        .imagecon > img{
            width: inherit;
            border-radius: 50%;
            height: inherit;

        }

        .imagecon > input{
            display: none;
        }

        .qrcontainer{
            position:absolute;
            width:100px;
            height:100px;
            border: 5px solid aqua;
            right: 10%;
        }

        .qrcontainer > img{
            width:100%;
            height: 100%;
        }

        
    </style>
</head>
<body>
    <nav style="z-index: 9999;">
        <div class="logo">
            <img src="../static/img/icon/Glitch.gif" alt="">
        </div>

        <div class="buttons">
            <button class="nv" data-text="Home"><a>Home</a></button>
            <button class="nv" data-text="Videos"><a>Videos</a></button>
            <button class="nv" data-text="About Us"><a>About Us</a></button>
            <button class="nv" data-text="Help"><a>Post</a></button>
            <button class="profile" onclick="toggleprofile()"><img src="../{{profile[3]}}" alt=""></button>
        </div>

        

        <span class="tprofile">
            <button onclick="window.location.href = '/profile'">Profile</button>
            <button  >Saved</button>
            <button onclick="window.location.href = '/logout'">Logout</button>
        </span>
    </nav>


    <main>
        <div class="profilecon">
            <form action="/updateprofile" method="post" enctype="multipart/form-data">
                <div class="profilepic">
                    <div class="imagecon">
                        <img src="../{{profile[3]}}" alt="">
                        <label for="immy" >+</label>
                        <input id="immy" name="profile" type="file">
                    </div>
                </div>

                <div class="profileinfo">
                    <div>
                        <label for="name">Name: </label>
                        <input id="name" name="name" type="text" value="{{profile[1]}}">
                    </div>

                    <div>
                        <label for="password">Password: </label>
                        <input id="password" name="pass" type="password" value="{{profile[2]}}">
                    </div>

                    <input type="submit" >
                </div>



            </form>


        </div>

        <div class="qrcontainer">
            <img src="../{{profile[4]}}" alt="no image">
        </div>



    </main>




    <script src="{{url_for('static',filename='sc.js')}}"></script>
    
</body>
</html>
